media:
  input: media
  output: /media

components:
  seo:
    type: object
    label: SEO
    fields:
      - name: title
        label: SEO title
        type: string
      - name: description
        label: Meta description
        type: text

content:

  - name: blog
    label: Blog
    type: collection
    path: content/blog
    filename: "{slug}.md"
    fields:
      - name: title
        label: Article title
        type: string
        required: true

      - name: slug
        label: URL slug
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"

      - name: description
        label: Short description
        type: text
        required: true

      - name: category
        label: Category
        type: select
        options:
          values:
            - SEO & Search
            - Website
            - Content
            - Digital Marketing
            - Education

      - name: date
        label: Publish date
        type: date

      - name: published
        label: Published
        type: boolean
        default: true

      - name: featured_image
        label: Featured image
        type: image
        options:
          media: default
          path: blog
          extensions: [jpg, jpeg, png, webp]
          rename: safe

      - name: seo
        component: seo
        label: Search appearance

      - name: body
        label: Article
        type: rich-text
        required: true

    view:
      primary: title
      fields: [title, category, date]
      sort: [date]
      default:
        sort: date
        order: desc

    operations:
      delete: true


  - name: education
    label: Education
    type: collection
    path: content/education
    filename: "{slug}.md"
    fields:

      - name: title
        label: Page title
        type: string
        required: true

      - name: slug
        label: URL slug
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"

      - name: section
        label: Section
        type: select
        required: true
        options:
          values:
            - Colleges & Universities
            - Academic Courses
            - Career Guidance
            - Skill Courses
            - Study Abroad Guide
            - Consultancy

      - name: page_type
        label: Page type
        type: select
        required: true
        options:
          values:
            - Pillar / Section guide
            - College / University
            - Academic Course
            - Career Guide
            - Skill Course
            - Study Destination
            - Consultancy
            - Education Guide

      - name: description
        label: Short description
        type: text
        required: true

      - name: published
        label: Published
        type: boolean
        default: true

      - name: date
        label: Publish date
        type: date

      - name: featured_image
        label: Featured image
        type: image
        options:
          media: default
          path: education
          extensions: [jpg, jpeg, png, webp, svg]
          rename: safe

      - name: official_url
        label: Official website / source
        type: string

      - name: parent_slug
        label: Parent Education page slug
        type: string

      - name: related_education
        label: Related Education slugs
        type: string

      - name: related_blog
        label: Related Blog slugs
        type: string

      - name: seo
        component: seo
        label: Search appearance

      - name: body
        label: Page content
        type: rich-text
        required: true

    view:
      primary: title
      fields: [title, section, page_type, date]
      sort: [date]
      default:
        sort: date
        order: desc

    operations:
      delete: true
